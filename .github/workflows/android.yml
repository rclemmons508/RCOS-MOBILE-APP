name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # secrets.* cannot be used in step `if:` conditions (GitHub rejects the
      # whole file). Mirror it to env here, then gate steps on env instead.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Verify Versions
        run: |
          node --version
          npm --version
          npx cap --version

      - name: Lint and Typecheck
        run: npm run lint

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Configure Android SDK & Command-Line Tools
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "cmdline-tools;latest" "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.p12

      - name: Verify signing secrets present
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!name}"
            if [ -z "$val" ]; then echo "::error::Secret $name is missing or empty"; missing=1; else echo "OK: $name is set"; fi
          done
          exit $missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Android Release APK (signed)
        if: ${{ env.HAS_RELEASE_KEYSTORE != '' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        if: ${{ env.HAS_RELEASE_KEYSTORE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-App-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
