name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# A newer push to the same branch/PR cancels the build that is still running.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    # No job-level secrets: signing secrets are passed only to the steps that
    # need them, so `npm ci` lifecycle scripts and other steps never see them.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Web Dependencies
        run: npm ci

      - name: Verify Versions
        run: |
          node --version
          npm --version
          npx cap --version

      - name: Lint and Typecheck
        run: npm run lint

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Configure Android SDK & Command-Line Tools
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "cmdline-tools;latest" "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Caches the Gradle wrapper, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew
        working-directory: android

      # versionCode comes from GITHUB_RUN_NUMBER (read in app/build.gradle),
      # so every CI build is installable over the previous one.
      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Signed release builds run only on pushes to main/master and manual runs,
      # and only when the keystore secret exists. PRs (including forks, which
      # never receive secrets) stop after the debug APK and stay green.
      - name: Decide whether to build a signed release
        id: signing
        env:
          IS_RELEASE_EVENT: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$IS_RELEASE_EVENT" = "true" ] && [ "$HAS_KEYSTORE" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Signed release build: enabled"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_RELEASE_EVENT" = "true" ]; then
              echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the signed release build."
            else
              echo "Signed release build: skipped for ${{ github.event_name }}"
            fi
          fi

      - name: Verify signing secrets present
        if: steps.signing.outputs.release == 'true'
        run: |
          missing=0
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!name}"
            if [ -z "$val" ]; then echo "::error::Secret $name is missing or empty"; missing=1; else echo "OK: $name is set"; fi
          done
          exit $missing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode release keystore
        if: steps.signing.outputs.release == 'true'
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.p12
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.release == 'true'
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/release.p12

      - name: Upload Release APK + AAB Artifacts
        if: steps.signing.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-App-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
