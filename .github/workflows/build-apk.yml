name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Web Dependencies
        run: npm ci || npm install --force

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Fix gradlew Permissions & Endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug -x test -x lint --stacktrace --continue
        working-directory: android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RCOS-Mobile-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
