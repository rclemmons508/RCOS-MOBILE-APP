name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Verify Versions
        run: |
          node --version
          npm --version
          npx cap --version

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Configure Android SDK & Command-Line Tools
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-Mobile-App-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
