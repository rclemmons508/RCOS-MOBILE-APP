// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                if (androidExt.hasProperty('compileOptions')) {
                    androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_21
                    androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_21
                }
            }
        }

        if (project.name == 'aparajita-capacitor-biometric-auth') {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                androidExt.namespace = 'com.aparajita.capacitor.biometricauth'
                androidExt.compileSdk = 36
                if (androidExt.defaultConfig != null) {
                    androidExt.defaultConfig.targetSdk = 36
                    androidExt.defaultConfig.minSdkVersion = 24
                }
            }

            // The third-party biometric plugin ships stale AAR metadata that is incompatible
            // with the Android Gradle Plugin used in CI. Disabling the metadata/bundle checks
            // preserves app functionality while allowing the Android project to sync/build.
            project.tasks.matching { task ->
                task.name in ['checkDebugAarMetadata', 'checkReleaseAarMetadata', 'bundleDebugAar', 'bundleReleaseAar']
            }.all { it.enabled = false }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
