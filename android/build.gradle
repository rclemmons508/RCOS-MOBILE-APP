// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.name == 'aparajita-capacitor-biometric-auth') {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                androidExt.namespace = 'com.aparajita.capacitor.biometricauth'
                androidExt.compileSdk = 35
                if (androidExt.defaultConfig != null) {
                    androidExt.defaultConfig.targetSdk = 35
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
