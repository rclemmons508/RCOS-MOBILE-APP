apply plugin: 'com.android.application'

// versionCode: -PversionCode=<n> wins, then CI's GITHUB_RUN_NUMBER (strictly
// increasing per workflow), else a local default. Every CI build therefore
// installs over the previous one and can be uploaded to Play.
// NOTE: renaming/recreating the Android workflow resets GITHUB_RUN_NUMBER;
// pass -PversionCode higher than the last published value if that happens.
def localVersionCode = 3
def resolveVersionCode = {
    def raw = project.findProperty('versionCode') ?: System.getenv('GITHUB_RUN_NUMBER')
    if (raw != null && raw.toString().trim().isInteger()) {
        return Math.max(raw.toString().trim().toInteger(), localVersionCode)
    }
    return localVersionCode
}

// versionName follows "version" in the root package.json.
def resolveVersionName = {
    try {
        def pkg = new groovy.json.JsonSlurper().parse(file("$rootDir/../package.json"))
        if (pkg.version) return pkg.version.toString()
    } catch (Exception ignored) { }
    return "1.0.1"
}

android {
    namespace = "com.rcsolutions.rcosmobile"
    compileSdk = 36
    defaultConfig {
        applicationId "com.rcsolutions.rcosmobile"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode resolveVersionCode()
        versionName resolveVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Release keystore is decoded from the ANDROID_KEYSTORE_BASE64 secret
            // into android/release.p12 by CI. Local release builds need that file.
            storeFile file("$rootDir/release.p12")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "rcos"
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
